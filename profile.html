<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Mumbai Share Auto</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
      color: #023047;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-brand { font-weight: 700; font-size: 20px; color: #023047; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 16px; }
    .nav-links a {
      color: #023047;
      font-weight: 500;
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .nav-links a:hover, .nav-links a.active {
      background: #0077b6;
      color: white;
      transform: translateY(-1px);
    }
    .main-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 80vh;
      padding: 40px 10px 60px 10px;
      flex-grow: 1;
    }
    .profile-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 38px 32px;
      width: 100%;
      max-width: 540px;
      margin-bottom: 32px;
    }
    .profile-heading { font-size: 26px; font-weight: 700; color: #0077b6; margin-bottom: 26px; text-align: center; }
    .section-title { font-size: 20px; font-weight: 600; color: #0096c7; margin-bottom: 24px; border-bottom: 2px solid #e3f2fd; padding-bottom: 7px; }
    .profile-field { margin-bottom: 18px; }
    .profile-field label { display: block; margin-bottom: 7px; font-weight: 500; color: #023047; }
    .profile-field input {
      width: 100%; padding: 12px 13px; border: 1.7px solid #d0d7de;
      border-radius: 12px; background: #f9fbfc; font-size: 15px; color: #023047;
    }
    .value-display { padding: 12px 13px; background: #f5faff; border-radius: 11px; font-size: 15px; color: #1a1a1a; }
    .btn-primary {
      width: 100%; background: linear-gradient(90deg, #0077b6, #0096c7);
      color: white; font-weight: 600; font-size: 16px;
      padding: 13px 0; border-radius: 12px; border: none;
    }
    .btn-secondary {
      background: #e3f2fd; color: #0077b6;
      font-weight: 600; font-size: 15px; border: none;
      border-radius: 11px; padding: 12px 0;
    }
    .contact-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 10px; background: #f5fafe; border-radius: 8px; margin-bottom: 10px;
    }
    .btn-delete { background: #fff; color: #d32f2f; border: 1.5px solid #d32f2f; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
    footer { background: #023047; color: white; text-align: center; font-size: 14px; padding: 14px; margin-top: auto; }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-brand">🛺 <span>Mumbai Share Auto</span></div>
    <div class="nav-links">
      <a href="index.html">🏠 Home</a>
      <a href="fare-calculator.html">💰 Fare Calculator</a>
      <a href="stands-map.html">🗺️ Find Stands</a>
      <a href="route-finder.html">🎯 Route Finder</a>
      <a href="safety.html">🚨 Safety</a>
      <a href="http://localhost:5500">📱 Booking</a>
      <a href="profile.html" class="active">👤 Profile</a>
      <a href="logout.html">🚪 Logout</a>
    </div>
  </nav>

  <main class="main-wrap">
    <!-- User Profile -->
<section id="user-profile-section" class="profile-card">
      <h1 class="profile-heading">My Profile</h1>
      <h2 class="section-title">Profile Information</h2>
      <div id="profile-success" class="success-message"></div>
      <div id="profile-error" class="error-message"></div>

      <div class="profile-field">
        <label>Username</label>
        <input type="text" id="display-username" />
      </div>
      <div class="profile-field">
        <label>Email</label>
        <input type="email" id="display-email" />
      </div>
      <div class="profile-field">
        <label>Phone Number</label>
        <input type="tel" id="user-phone" maxlength="10" placeholder="Enter phone number" />
      </div>
      <button class="btn-primary" id="update-user-profile">Update Profile</button>
    </section>

    <!-- Emergency Contacts -->
<section id="emergency-contacts-section" class="profile-card">
      <h2 class="section-title">Emergency Contacts</h2>
      <div id="contacts-success" class="success-message"></div>
      <div id="contacts-error" class="error-message"></div>
      <div id="contacts-list" class="contacts-list"></div>
      <div id="empty-contacts-state" class="empty-state hidden">
        <div class="empty-state-icon">📱</div>
        <p>No emergency contacts added yet.</p>
      </div>
      <div class="button-group">
        <button class="btn-secondary" id="show-add-contact-form">Add Emergency Contact</button>
      </div>

      <form id="add-contact-form" class="add-contact-form">
        <div class="profile-field">
          <label>Contact Name *</label>
          <input type="text" id="new-contact-name" placeholder="Contact name" />
        </div>
        <div class="profile-field">
          <label>Contact Phone *</label>
          <input type="tel" id="new-contact-phone" maxlength="10" placeholder="Phone number" />
        </div>
        <div class="profile-field">
          <label>Contact Email *</label>
          <input type="email" id="new-contact-email" placeholder="Email address" />
        </div>
        <div class="button-group">
          <button class="btn-primary" type="button" id="save-contact">Save Contact</button>
          <button class="btn-secondary" type="button" id="cancel-add-contact">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <footer>© 2025 ShareRickshaw | Smarter Mumbai Commutes</footer>

<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="script.js"></script>

  <script>
    if (!window.isLoggedIn()) {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
